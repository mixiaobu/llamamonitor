name: Release (Windows x64)

# CI：在 GitHub Actions 上构建 Windows x64 发布物。
# - 打 tag（如 0.13.1 或 v0.13.1）：构建 + 验证 + 创建 GitHub Release（5 个资产，
#   供 Phase 13 安全更新系统消费：manifest + .sig + installer + portable + SHA256SUMS）；
# - workflow_dispatch：构建 + 验证 + upload-artifact（不创建 Release）。
#
# Phase 13 更新签名（docs/UPDATE_SECURITY.md）：
# - 私钥只来自 GitHub Actions Secret `LLAMAMONITOR_UPDATE_PRIVATE_KEY_B64`
#   （Base64(PEM)）；解码到 runner 临时文件后通过 LLAMAMONITOR_UPDATE_PRIVATE_KEY_FILE
#   传给构建脚本，**全程不 echo**（只输出文件路径与大小）；
# - key_id 来自仓库变量 LLAMAMONITOR_UPDATE_KEY_ID（缺省 = update_keys.DEFAULT_KEY_ID）；
# - 正式 Release 构建缺 secret -> 构建失败（不产出可信任的更新）。
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # tag 触发时需要创建 GitHub Release

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Inno Setup 6
        run: |
          choco install innosetup -y --no-progress

      - name: Decode update signing key (secret -> runner temp file, never echo)
        # §95：私钥 Base64 解码到 RUNNER_TEMP 临时文件；日志只打印路径与字节数，
        # 绝不打印密钥内容。key_id 从仓库变量读取（可轮换）。
        run: |
          $ErrorActionPreference = 'Stop'
          $keyFile = Join-Path $env:RUNNER_TEMP "llamamonitor-update-key.pem"
          $bytes = [Convert]::FromBase64String($env:LLAMAMONITOR_UPDATE_PRIVATE_KEY_B64)
          [System.IO.File]::WriteAllBytes($keyFile, $bytes)
          Add-Content -Path $env:GITHUB_ENV -Value "LLAMAMONITOR_UPDATE_PRIVATE_KEY_FILE=$keyFile"
          Write-Host "Update signing key decoded to $(Split-Path $keyFile -Leaf) ($($bytes.Length) bytes) at: $keyFile"
        env:
          LLAMAMONITOR_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LLAMAMONITOR_UPDATE_PRIVATE_KEY_B64 }}

      - name: Set signing key id
        # 仓库变量 LLAMAMONITOR_UPDATE_KEY_ID 缺省时用 update_keys.DEFAULT_KEY_ID
        run: |
          $KeyId = if ($env:LLAMAMONITOR_UPDATE_KEY_ID) { $env:LLAMAMONITOR_UPDATE_KEY_ID } else { "key-2026-09" }
          Add-Content -Path $env:GITHUB_ENV -Value "LLAMAMONITOR_UPDATE_KEY_ID=$KeyId"
          Write-Host "Signing key id: $KeyId"
        env:
          LLAMAMONITOR_UPDATE_KEY_ID: ${{ vars.LLAMAMONITOR_UPDATE_KEY_ID }}

      - name: Build release artifacts (tests + PyInstaller + installer + signed manifest)
        run: python scripts\build_release.py --require-installer

      - name: Validate release (incl. Ed25519 signature verification)
        run: python scripts\validate_release.py

      - name: Create GitHub Release (tag builds)
        # 5 个资产 = 更新器需要的全部（manifest + sig 是信任链；installer/portable 是
        # 下载目标；SHA256SUMS 供人工核对）。draft/prerelease 标记确保 stable 通道
        # 只取正式 Release。
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content version.py -Raw) -match '(__version__\s*=\s*")([0-9.]+)' | Out-Null
          $ver = $Matches[2]
          $assets = @(
            "release/LlamaMonitor-Setup-$ver-win-x64.exe",
            "release/LlamaMonitor-$ver-win-x64.zip",
            "release/release-manifest.json",
            "release/release-manifest.sig",
            "release/SHA256SUMS.txt"
          )
          foreach ($a in $assets) {
            if (-not (Test-Path $a)) { Write-Error "Missing release asset: $a"; exit 1 }
          }
          gh release delete "${{ github.ref_name }}" --force --cleanup-tag 2>$null
          gh release create "${{ github.ref_name }}" @assets `
            --title "LlamaMonitor $ver" `
            --notes "LlamaMonitor $ver (Windows x64). Verify with release-manifest.sig (Ed25519) — see UPDATE_SECURITY.md."
          Write-Host "GitHub Release created: ${{ github.ref_name }} ($ver)"

      - name: Upload portable zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LlamaMonitor-portable
          path: release/LlamaMonitor-*-win-x64.zip
          if-no-files-found: error

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LlamaMonitor-setup
          path: release/LlamaMonitor-Setup-*-win-x64.exe
          if-no-files-found: error

      - name: Upload checksums + signed manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LlamaMonitor-checksums
          path: |
            release/SHA256SUMS.txt
            release/release-manifest.json
            release/release-manifest.sig
          if-no-files-found: error
